<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048</title>
  <link rel="stylesheet" href="/static/desktop/theme.css" />
  <style>
    /* ── SUS theme tokens ───────────────────────────────────────────────────
       Every value below reads the platform token first and falls back to a
       matching local value, so the page looks right whether or not
       theme.css loads. Light/dark comes from the viewer's system setting.
    ────────────────────────────────────────────────────────────────────── */
    :root {
      --_ink:          var(--ink, #1f1b16);
      --_ink-soft:     var(--ink-soft, #6f675d);
      --_line:         var(--line, rgba(31, 27, 22, 0.12));
      --_panel:        var(--panel-solid, #fffdfa);
      --_panel-2:      var(--panel-2, #f4efe8);
      --_bg:           var(--desktop-bg, var(--desktop-solid, #f2ede5));
      --_accent:       var(--accent, #e8a33d);
      --_accent-ink:   var(--accent-ink, #241a08);
      --_accent-weak:  var(--accent-weak, rgba(232, 163, 61, 0.14));
      --_radius:       var(--radius, 12px);
      --_radius-sm:    var(--radius-sm, 7px);
      --_shadow:       var(--shadow-card, 0 1px 2px rgba(31, 27, 22, 0.05), 0 10px 30px rgba(31, 27, 22, 0.07));
      --_ease-snap:    cubic-bezier(0.22, 1, 0.36, 1);
      --_font:         var(--font-ui, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --_ink:         var(--ink, #f2ece3);
        --_ink-soft:    var(--ink-soft, #a49b8e);
        --_line:        var(--line, rgba(255, 255, 255, 0.12));
        --_panel:       var(--panel-solid, #211e1a);
        --_panel-2:     var(--panel-2, #191713);
        --_bg:          var(--desktop-bg, var(--desktop-solid, #141210));
        --_accent:      var(--accent, #f0ad4a);
        --_accent-ink:  var(--accent-ink, #221703);
        --_accent-weak: var(--accent-weak, rgba(240, 173, 74, 0.16));
        --_shadow:      var(--shadow-card, 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 30px rgba(0, 0, 0, 0.35));
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--_bg);
      color: var(--_ink);
      font-family: var(--_font);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 32px;
      min-height: 100vh;
    }

    .sus-page { width: 100%; max-width: 480px; }

    .sus-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(32px, 8vw, 42px);
      font-weight: 650;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--_ink);
    }

    .scores { display: flex; gap: 8px; }

    .score-box {
      background: var(--_panel-2);
      border: 1px solid var(--_line);
      border-radius: var(--_radius-sm);
      padding: 6px 12px;
      text-align: center;
      min-width: 74px;
    }
    .score-box .label {
      font-size: 10px; font-weight: 600; color: var(--_ink-soft);
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .score-box .value {
      font-size: 20px; font-weight: 650; color: var(--_ink);
      font-variant-numeric: tabular-nums;
    }
    .score-box.is-best .value { color: var(--_accent); }

    /* ── Card ───────────────────────────────────────────────────────────── */
    .card {
      background: var(--_panel);
      border: 1px solid var(--_line);
      border-radius: var(--_radius);
      box-shadow: var(--_shadow);
      padding: 16px;
    }

    .controls {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin-bottom: 14px;
    }
    .subtitle { font-size: 13px; color: var(--_ink-soft); }
    .subtitle strong { color: var(--_ink); font-weight: 600; }

    /* ── Buttons ────────────────────────────────────────────────────────── */
    .btn {
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: var(--_radius-sm);
      border: 1px solid var(--_line);
      background: var(--_panel-2);
      color: var(--_ink);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.05s;
    }
    .btn:hover { background: var(--_accent-weak); }
    .btn:active { transform: translateY(1px); }
    .btn:focus-visible { outline: 2px solid var(--_accent); outline-offset: 2px; }

    .btn--primary {
      background: var(--_accent);
      color: var(--_accent-ink);
      border-color: transparent;
    }
    .btn--primary:hover { background: color-mix(in oklab, var(--_accent) 88%, var(--_ink)); }

    /* ── Board ──────────────────────────────────────────────────────────────
       Tiles are absolutely positioned. With padding=12, gap=12, 4 cells:
         cell size = (100% - 60px) / 4
         cell step = (100% - 12px) / 4
         cell left = 12px + col × (100% - 12px) / 4
    ────────────────────────────────────────────────────────────────────── */
    .board-wrapper { position: relative; width: 100%; }

    #board {
      position: relative;
      background: var(--_panel-2);
      border: 1px solid var(--_line);
      border-radius: var(--_radius);
      padding: 12px;
      width: 100%;
      aspect-ratio: 1;
      user-select: none;
      touch-action: none;
    }

    .bg-cell, .tile {
      position: absolute;
      width:  calc((100% - 60px) / 4);
      height: calc((100% - 60px) / 4);
      left: calc(12px + var(--col, 0) * (100% - 12px) / 4);
      top:  calc(12px + var(--row, 0) * (100% - 12px) / 4);
      border-radius: var(--_radius-sm);
    }

    .bg-cell {
      background: var(--_panel);
      border: 1px solid var(--_line);
      opacity: 0.55;
      z-index: 1;
    }

    .tile {
      /* Slide offset, in tile-widths: one grid step = own width + the 12px gap.
         Used by the keyframes below so motion is a transform, never a reflow. */
      --dx: calc((var(--from-col, var(--col, 0)) - var(--col, 0)) * (100% + 12px));
      --dy: calc((var(--from-row, var(--row, 0)) - var(--row, 0)) * (100% + 12px));
      display: flex; align-items: center; justify-content: center;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      font-size: clamp(18px, 4vw, 38px);
      z-index: 2;
    }

    /* ── Overlay ────────────────────────────────────────────────────────── */
    .overlay {
      position: absolute; inset: 0;
      background: color-mix(in srgb, var(--_panel) 82%, transparent);
      border-radius: var(--_radius);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      z-index: 20; opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    .overlay.visible {
      opacity: 1; pointer-events: all;
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
    }
    .overlay-msg {
      font-size: clamp(28px, 7vw, 40px);
      font-weight: 650;
      letter-spacing: -0.02em;
      color: var(--_ink);
    }

    /* ── Animations ─────────────────────────────────────────────────────────
       All motion is handled by CSS animations, not transitions.
       Every move triggers a single syncDOM() call; CSS sequences the rest.

       Tiles are laid out with left/top, but they MOVE with transform only,
       so a slide is composited rather than re-running layout every frame.
       Each keyframe starts at the tile's previous cell (--from-row/--from-col
       expressed as --dx/--dy) and animates back to translate(0, 0), which is
       the tile's natural position.

       Timeline per move (SLIDE_MS = 65):
         0 ────── 65 ─────── 130
         [ slide ][ pop      ]
              [ appear ]  (starts at 40ms)
       The easing is easeOutQuint: nearly all the distance is covered in the
       first third of the slide, so it reads as instant with a soft landing.
       Input unlocks at 65ms — the pop is cosmetic and does not gate the
       next move.
    ────────────────────────────────────────────────────────────────────── */
    @keyframes tile-slide {
      from { transform: translate(var(--dx), var(--dy)); }
      to   { transform: translate(0, 0); }
    }

    /* Slide and pop in one animation: two animations on the same element
       cannot both drive `transform`. 50% == 65ms of the 130ms total. */
    @keyframes tile-merge {
      0%   { transform: translate(var(--dx), var(--dy)) scale(1); }
      50%  { transform: translate(0, 0) scale(1); }
      78%  { transform: translate(0, 0) scale(1.15); }
      100% { transform: translate(0, 0) scale(1); }
    }

    @keyframes tile-appear {
      from { transform: scale(0.35); opacity: 0; }
      60%  { transform: scale(1.06); opacity: 1; }
      to   { transform: scale(1);    opacity: 1; }
    }

    /* Plain slide (no merge) */
    .tile.sliding {
      animation: tile-slide 65ms var(--_ease-snap) both;
    }

    /* Slides then pops with new value — sits on top of merge-away */
    .tile.merging {
      animation: tile-merge 130ms var(--_ease-snap) both;
      z-index: 4;
    }

    /* Slides to destination then hides under the merging tile */
    .tile.merge-away {
      animation: tile-slide 65ms var(--_ease-snap) both;
      z-index: 3;
      pointer-events: none;
    }

    /* Appears just before the slides land, so the board settles as one */
    .tile.new {
      animation: tile-appear 90ms 40ms var(--_ease-snap) both;
    }

    @media (prefers-reduced-motion: reduce) {
      .tile.sliding, .tile.merging, .tile.merge-away, .tile.new {
        animation-duration: 1ms;
        animation-delay: 0ms;
      }
      .overlay { transition: none; }
    }

    /* ── Tile ramp ──────────────────────────────────────────────────────────
       One accent, twelve steps: each tile mixes more of --accent into the
       board surface, so the ladder reads as a single warm scale in both
       light and dark mode. Text flips to --accent-ink once the tile is
       bright enough to need dark type.
    ────────────────────────────────────────────────────────────────────── */
    .tile { background: var(--_panel-2); color: var(--_ink); }

    .t2    { background: color-mix(in oklab, var(--_accent) 10%, var(--_panel-2)); }
    .t4    { background: color-mix(in oklab, var(--_accent) 20%, var(--_panel-2)); }
    .t8    { background: color-mix(in oklab, var(--_accent) 32%, var(--_panel-2)); }
    .t16   { background: color-mix(in oklab, var(--_accent) 44%, var(--_panel-2)); }
    .t32   { background: color-mix(in oklab, var(--_accent) 56%, var(--_panel-2)); }

    .t64   { background: color-mix(in oklab, var(--_accent) 70%, var(--_panel-2)); color: var(--_accent-ink); }
    .t128  { background: color-mix(in oklab, var(--_accent) 82%, var(--_panel-2)); color: var(--_accent-ink); font-size: clamp(15px, 3.5vw, 34px); }
    .t256  { background: color-mix(in oklab, var(--_accent) 90%, var(--_panel-2)); color: var(--_accent-ink); font-size: clamp(15px, 3.5vw, 34px); }
    .t512  { background: color-mix(in oklab, var(--_accent) 96%, var(--_panel-2)); color: var(--_accent-ink); font-size: clamp(15px, 3.5vw, 34px); }
    .t1024 { background: var(--_accent); color: var(--_accent-ink); font-size: clamp(13px, 3vw, 28px); }

    .t2048 {
      background: var(--_accent);
      color: var(--_accent-ink);
      font-size: clamp(13px, 3vw, 28px);
      box-shadow: 0 0 0 2px var(--_panel), 0 0 0 4px var(--_accent), 0 0 18px var(--_accent-weak);
    }

    /* Past 2048 — inverted, so it stands apart from the accent ladder */
    .tsuper {
      background: var(--_ink);
      color: var(--_panel);
      font-size: clamp(11px, 2.5vw, 24px);
    }

    .hint { margin-top: 12px; font-size: 12px; color: var(--_ink-soft); text-align: center; }
  </style>
</head>
<body>

<div class="sus-page">

  <div class="sus-header">
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="score-box is-best"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>

  <div class="card">
    <div class="controls">
      <span class="subtitle">Join tiles to reach <strong>2048</strong></span>
      <button id="newGame" class="btn btn--primary">New Game</button>
    </div>

    <div class="board-wrapper">
      <div class="overlay" id="overlay">
        <div class="overlay-msg" id="overlayMsg"></div>
        <button id="overlayBtn" class="btn btn--primary">Try Again</button>
      </div>
      <div id="board"></div>
    </div>

    <p class="hint">Use arrow keys or swipe to play.</p>
  </div>

</div>

<script>
  // ── Cookie helpers ─────────────────────────────────────────────────────────
  function setCookie(name, value, days = 3650) {
    const exp = new Date(Date.now() + days * 864e5).toUTCString();
    document.cookie = `${name}=${encodeURIComponent(value)};expires=${exp};path=/;SameSite=Lax`;
  }
  function getCookie(name) {
    const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  }

  // ── Cached DOM refs ────────────────────────────────────────────────────────
  // Looked up once at load instead of on every move.
  const boardEl      = document.getElementById('board');
  const scoreEl      = document.getElementById('score');
  const bestEl       = document.getElementById('best');
  const overlayEl    = document.getElementById('overlay');
  const overlayMsgEl = document.getElementById('overlayMsg');

  // ── State ──────────────────────────────────────────────────────────────────
  let tiles = [];
  let nextId = 0;
  let score = 0, best = 0;
  let animating   = false;
  let wonShown    = false;

  const tileEls = new Map(); // id → DOM element

  function makeTile(value, row, col) {
    return { id: nextId++, value, row, col, isNew: false };
  }

  function cellMap() {
    const m = Array.from({ length: 4 }, () => Array(4).fill(null));
    for (const t of tiles) m[t.row][t.col] = t;
    return m;
  }

  // ── Line helpers ───────────────────────────────────────────────────────────
  function getLine(map, idx, dir) {
    switch (dir) {
      case 'left':  return [0,1,2,3].map(c => map[idx][c]);
      case 'right': return [3,2,1,0].map(c => map[idx][c]);
      case 'up':    return [0,1,2,3].map(r => map[r][idx]);
      case 'down':  return [3,2,1,0].map(r => map[r][idx]);
    }
  }

  function lineToGrid(idx, pos, dir) {
    switch (dir) {
      case 'left':  return [idx,     pos];
      case 'right': return [idx,     3 - pos];
      case 'up':    return [pos,     idx];
      case 'down':  return [3 - pos, idx];
    }
  }

  // ── Compress ───────────────────────────────────────────────────────────────
  function compressLine(line) {
    const src = line.filter(Boolean);
    const moves = [], merges = [];
    let gained = 0, out = 0, i = 0;
    while (i < src.length) {
      if (i + 1 < src.length && src[i].value === src[i + 1].value) {
        const v = src[i].value * 2;
        gained += v;
        moves.push({ tile: src[i],     pos: out });
        moves.push({ tile: src[i + 1], pos: out });
        merges.push({ into: src[i], from: src[i + 1], newValue: v });
        i += 2;
      } else {
        moves.push({ tile: src[i], pos: out });
        i++;
      }
      out++;
    }
    return { moves, merges, gained };
  }

  // ── Spawn ──────────────────────────────────────────────────────────────────
  function spawnRandom(isNew) {
    const map = cellMap();
    const empty = [];
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < 4; c++)
        if (!map[r][c]) empty.push([r, c]);
    if (!empty.length) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    const t = makeTile(Math.random() < 0.9 ? 2 : 4, r, c);
    t.isNew = isNew;
    tiles.push(t);
  }

  // ── Move ───────────────────────────────────────────────────────────────────
  // Animation timeline (ms):
  //   0 ──────── 65 ─────── 130
  //   [ slide  ] [ pop      ]
  //
  // Input unlocks when the slide lands, not when the whole animation ends —
  // the pop and the new-tile appear are cosmetic and keep running while the
  // next move is already being accepted. A key pressed inside that 65ms
  // window is buffered rather than dropped.
  const SLIDE_MS  = 65;  // slide duration — also the input lock
  const SETTLE_MS = 140; // pop + appear have finished by here

  let unlockTimer = null;
  let settleTimer = null;
  let bufferedDir = null;

  // Strips animation classes so the next move starts clean. Idempotent, so a
  // move that interrupts the previous one can call it early.
  function settle() {
    if (settleTimer !== null) { clearTimeout(settleTimer); settleTimer = null; }
    for (const t of tiles) {
      t.isNew = false;
      const el = tileEls.get(t.id);
      if (el) el.className = `tile ${tileClass(t.value)}`;
    }
  }

  function move(dir) {
    if (animating) { bufferedDir = dir; return; }

    // Finish the previous move's cosmetics before starting this one. The flush
    // is essential: settle() and syncDOM() run in the same task, so without a
    // style recalculation in between, the browser only ever sees the final
    // computed style. `animation-name` would go tile-slide -> tile-slide, look
    // unchanged, and the animation would NOT restart — the tile would jump
    // straight to its new cell. Reading a layout property forces the flush.
    settle();
    void boardEl.offsetHeight;

    // 1. Snapshot positions before any changes
    const oldPos = new Map(tiles.map(t => [t.id, { row: t.row, col: t.col }]));

    // 2. Compute all moves and merges
    const map = cellMap();
    let hasMoved = false, totalGained = 0;
    const allMerges = [], removeIds = new Set(), mergeIntoIds = new Set();

    for (let li = 0; li < 4; li++) {
      const { moves, merges, gained } = compressLine(getLine(map, li, dir));
      totalGained += gained;
      for (const { tile, pos } of moves) {
        const [nr, nc] = lineToGrid(li, pos, dir);
        if (nr !== tile.row || nc !== tile.col) hasMoved = true;
        tile.row = nr; tile.col = nc;
      }
      for (const mg of merges) {
        allMerges.push(mg);
        removeIds.add(mg.from.id);
        mergeIntoIds.add(mg.into.id);
      }
    }

    if (!hasMoved) return;

    // 3. Apply merge values and score
    for (const { into, newValue } of allMerges) into.value = newValue;
    score += totalGained;
    if (score > best) { best = score; saveBest(best); }

    // 4. Spawn new tile (added to `tiles` now, DOM element created in syncDOM)
    spawnRandom(true);

    // 5. Single DOM update — all animation classes applied in one pass
    animating = true;
    syncDOM(oldPos, removeIds, mergeIntoIds);
    updateScores();

    // 6. Slide has landed: retire the merged-away tiles, unlock input, and
    //    play whatever key arrived mid-slide.
    unlockTimer = setTimeout(() => {
      unlockTimer = null;
      for (const id of removeIds) { tileEls.get(id)?.remove(); tileEls.delete(id); }
      tiles = tiles.filter(t => !removeIds.has(t.id));

      animating = false;
      checkState();

      if (bufferedDir) { const d = bufferedDir; bufferedDir = null; move(d); }
    }, SLIDE_MS);

    // 7. Cosmetics done — clear animation classes (unless a move beats us to it)
    settleTimer = setTimeout(settle, SETTLE_MS);
  }

  // ── DOM sync (called once per move) ───────────────────────────────────────
  function tileClass(v) { return v > 2048 ? 'tsuper' : 't' + v; }

  function syncDOM(oldPos, removeIds, mergeIntoIds) {
    for (const tile of tiles) {
      const old = oldPos.get(tile.id);
      let el = tileEls.get(tile.id);

      if (!el) {
        // Newly spawned tile — placed at final position, appears after slides
        el = document.createElement('div');
        el.style.setProperty('--row', tile.row);
        el.style.setProperty('--col', tile.col);
        el.className = `tile ${tileClass(tile.value)} new`;
        el.textContent = tile.value;
        boardEl.appendChild(el);
        tileEls.set(tile.id, el);
        continue;
      }

      // Set destination (--row/--col are the tile's natural position)
      el.style.setProperty('--row', tile.row);
      el.style.setProperty('--col', tile.col);

      const isAway = removeIds.has(tile.id);
      const isInto = mergeIntoIds.has(tile.id);
      const moved  = old.row !== tile.row || old.col !== tile.col;

      if (isAway) {
        // Slides to merge destination, then disappears under the merging tile
        el.style.setProperty('--from-row', old.row);
        el.style.setProperty('--from-col', old.col);
        el.className = `tile ${tileClass(tile.value)} merge-away`;
      } else if (isInto) {
        // Slides (if it moved) then pops — shows new value throughout
        el.textContent = tile.value;
        el.style.setProperty('--from-row', moved ? old.row : tile.row);
        el.style.setProperty('--from-col', moved ? old.col : tile.col);
        el.className = `tile ${tileClass(tile.value)} merging`;
      } else if (moved) {
        el.style.setProperty('--from-row', old.row);
        el.style.setProperty('--from-col', old.col);
        el.className = `tile ${tileClass(tile.value)} sliding`;
      } else {
        el.className = `tile ${tileClass(tile.value)}`;
      }
    }
  }

  function updateScores() {
    scoreEl.textContent = score;
    bestEl.textContent  = best;
  }

  // ── Game state ─────────────────────────────────────────────────────────────
  function checkState() {
    if (!wonShown && tiles.some(t => t.value >= 2048)) {
      wonShown = true;
      showOverlay('You win!');
      return;
    }
    // A move exists if any cell is empty, or any neighbour pair matches.
    // The right/below neighbour can itself be empty, so both need a guard —
    // without one this threw on nearly every move and game over was never
    // reached, because the exception aborted the scan.
    const map = cellMap();
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < 4; c++) {
        const t = map[r][c];
        if (!t) return;
        const right = c + 1 < 4 ? map[r][c + 1] : null;
        const below = r + 1 < 4 ? map[r + 1][c] : null;
        if (right && right.value === t.value) return;
        if (below && below.value === t.value) return;
      }
    showOverlay('Game over!');
  }

  // ── Overlay ────────────────────────────────────────────────────────────────
  function showOverlay(msg) {
    overlayMsgEl.textContent = msg;
    overlayEl.classList.add('visible');
  }
  function hideOverlay() {
    overlayEl.classList.remove('visible');
  }

  // ── Score persistence ──────────────────────────────────────────────────────
  function loadBest() { return parseInt(getCookie('2048_best') || '0', 10); }
  function saveBest(v) { setCookie('2048_best', v); }

  // ── Init ───────────────────────────────────────────────────────────────────
  function initGame() {
    for (const [, el] of tileEls) el.remove();
    tileEls.clear();
    tiles       = [];
    score       = 0;
    best        = loadBest();
    animating   = false;
    wonShown    = false;
    bufferedDir = null;
    if (unlockTimer !== null) { clearTimeout(unlockTimer); unlockTimer = null; }
    if (settleTimer !== null) { clearTimeout(settleTimer); settleTimer = null; }

    boardEl.querySelectorAll('.bg-cell').forEach(e => e.remove());
    const cells = document.createDocumentFragment();
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < 4; c++) {
        const cell = document.createElement('div');
        cell.className = 'bg-cell';
        cell.style.setProperty('--row', r);
        cell.style.setProperty('--col', c);
        cells.appendChild(cell);
      }
    boardEl.appendChild(cells);

    spawnRandom(false);
    spawnRandom(false);
    syncDOM(new Map(), new Set(), new Set()); // no animations on init
    updateScores();
    hideOverlay();
  }

  // ── Input: keyboard ────────────────────────────────────────────────────────
  const keyMap = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down' };
  document.addEventListener('keydown', e => {
    const dir = keyMap[e.key];
    if (!dir) return;
    e.preventDefault();
    move(dir); // auto-repeat is allowed; the slide lock paces it
  });

  // ── Input: touch / swipe ───────────────────────────────────────────────────
  const SWIPE_MIN = 18; // px before a drag counts as a swipe
  let touchStart = null;

  // Resolves the swipe the moment it clears the threshold, so the board reacts
  // mid-drag instead of waiting for the finger to lift.
  function trySwipe(t) {
    if (!touchStart) return;
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx) < SWIPE_MIN && Math.abs(dy) < SWIPE_MIN) return;
    touchStart = null;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else                             move(dy > 0 ? 'down'  : 'up');
  }

  boardEl.addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  boardEl.addEventListener('touchmove', e => trySwipe(e.touches[0]), { passive: true });

  // Fallback for a flick that ends before any touchmove is delivered.
  boardEl.addEventListener('touchend', e => {
    trySwipe(e.changedTouches[0]);
    touchStart = null;
  }, { passive: true });

  // ── Buttons ────────────────────────────────────────────────────────────────
  document.getElementById('newGame').addEventListener('click', initGame);
  document.getElementById('overlayBtn').addEventListener('click', initGame);

  // ── Start ──────────────────────────────────────────────────────────────────
  initGame();
</script>
</body>
</html>
